name: Verify

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Validate sources and generated seed
        run: |
          bun run sources:validate
          bun run sources:seed
          git diff --exit-code -- supabase/seed.sql src/data/intelligence-catalog.json

      - name: Start local Supabase
        run: bunx supabase start

      - name: Database tests
        run: |
          bun run test:db
          bunx supabase db lint --local --level warning

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:e2e

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup
